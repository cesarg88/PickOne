reporter: xcode

excluded:
  - .build
  - Build
  - DerivedData

disabled_rules:
  - closure_parameter_position
  - function_parameter_count
  - large_tuple
  - multiple_closures_with_trailing_closure
  - opening_brace
  - switch_case_alignment
  - trailing_comma

opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - last_where
  - modifier_order
  - operator_usage_whitespace
  - optional_enum_case_matching
  - prefer_zero_over_explicit_init
  - private_swiftui_state
  - protocol_property_accessors_order
  - redundant_nil_coalescing
  - redundant_type_annotation
  - redundant_void_return
  - return_arrow_whitespace
  - shorthand_optional_binding
  - shorthand_operator
  - sorted_first_last
  - toggle_bool
  - unhandled_throwing_task
  - unneeded_break_in_switch
  - unneeded_parentheses_in_closure_argument
  - unused_enumerated
  - void_return

line_length:
  warning: 140
  error: 180
  ignores_comments: true
  ignores_interpolated_strings: true
  ignores_urls: true

file_length:
  warning: 600
  error: 800

type_body_length:
  warning: 400
  error: 500

function_body_length:
  warning: 90
  error: 120

cyclomatic_complexity:
  warning: 15
  error: 25
  ignores_case_statements: true

modifier_order:
  preferred_modifier_order:
    - override
    - acl
    - setterACL
    - isolation
    - dynamic
    - mutators
    - lazy
    - final
    - required
    - convenience
    - typeMethods
    - owned

identifier_name:
  min_length:
    error: 2
  excluded:
    - id
    - x
    - y

custom_rules:
  no_new_combine:
    included: ".*\\.swift"
    name: "No new Combine"
    regex: "(?m)^\\s*import\\s+Combine\\b"
    message: "PickOne uses Swift Concurrency; do not introduce Combine."
    severity: error

  no_protocol_suffix:
    included: ".*\\.swift"
    name: "No Protocol suffix"
    regex: "\\bprotocol\\s+[A-Za-z_][A-Za-z0-9_]*Protocol\\b"
    message: "Name protocols for the role or capability they represent, without a Protocol suffix."
    severity: error
