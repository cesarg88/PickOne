name: iOS

on:
  pull_request:
  push:
    branches:
      - develop

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4

      - name: Prepare non-secret CI configuration
        run: |
          printf 'TMDB_API_KEY = CI_NOT_A_REAL_KEY\n' > Config/Debug.xcconfig
          printf 'TMDB_API_KEY = CI_NOT_A_REAL_KEY\n' > Config/Release.xcconfig

      - name: Check secrets
        run: Scripts/check-secrets.sh

      - name: Test
        run: |
          xcodebuild test \
            -project PickOne.xcodeproj \
            -scheme PickOne \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/PickOneTests" \
            CODE_SIGNING_ALLOWED=NO

      - name: Analyze
        run: |
          xcodebuild analyze \
            -project PickOne.xcodeproj \
            -scheme PickOne \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/PickOneAnalyze" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build release
        run: |
          xcodebuild build \
            -project PickOne.xcodeproj \
            -scheme PickOne \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/PickOneRelease" \
            CODE_SIGNING_ALLOWED=NO

      - name: Inspect app bundle
        run: Scripts/inspect-app-bundle.sh "$RUNNER_TEMP/PickOneRelease/Build/Products/Release-iphoneos/PickOne.app"
