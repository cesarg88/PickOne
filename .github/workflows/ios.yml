name: iOS

on:
  pull_request:
  push:
    branches:
      - develop

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Classify documentation-only changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          docs_only=true
          found_change=false
          if ! git rev-parse --verify 'HEAD^1' >/dev/null 2>&1; then
            docs_only=false
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]] && \
            ! git rev-parse --verify 'HEAD^2' >/dev/null 2>&1; then
            # A PR must be checked out at its synthetic merge commit. If not,
            # a last documentation commit could conceal earlier code changes.
            docs_only=false
          else
            changed_paths_file="$RUNNER_TEMP/ci-changed-paths"
            if ! git diff --name-only -z 'HEAD^1' HEAD > "$changed_paths_file"; then
              docs_only=false
            else
              while IFS= read -r -d '' changed_path; do
                found_change=true
                case "$changed_path" in
                  *.md) ;;
                  *) docs_only=false ;;
                esac
              done < "$changed_paths_file"
              if [[ "$found_change" == false ]]; then
                docs_only=false
              fi
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-xcode-26.4.1-python-3.13-pre-commit-4.6.0-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.0

      - name: Prepare non-secret CI configuration
        run: |
          printf 'TMDB_API_KEY = CI_NOT_A_REAL_KEY\n' > Config/Debug.xcconfig
          printf 'TMDB_API_KEY = CI_NOT_A_REAL_KEY\n' > Config/Release.xcconfig

      - name: Check secrets
        run: Scripts/check-secrets.sh

      - name: Format and lint
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Prepare iOS simulator
        id: simulator
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          simulator_udid="$(Scripts/prepare-ci-simulator.sh)"
          echo "udid=$simulator_udid" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          xcodebuild test \
            -project PickOne.xcodeproj \
            -scheme PickOne \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/PickOneTests" \
            -only-testing:PickOneTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Analyze
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          xcodebuild analyze \
            -project PickOne.xcodeproj \
            -scheme PickOne \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/PickOneAnalyze" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build release
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          xcodebuild build \
            -project PickOne.xcodeproj \
            -scheme PickOne \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/PickOneRelease" \
            CODE_SIGNING_ALLOWED=NO

      - name: Inspect app bundle
        if: steps.changes.outputs.docs_only != 'true'
        run: Scripts/inspect-app-bundle.sh "$RUNNER_TEMP/PickOneRelease/Build/Products/Release-iphoneos/PickOne.app"
