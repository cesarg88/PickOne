name: iOS

on:
  pull_request:
  push:
    branches:
      - develop

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-xcode-26.4.1-python-3.13-pre-commit-4.6.0-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.0

      - name: Prepare non-secret CI configuration
        run: |
          printf 'TMDB_API_KEY = CI_NOT_A_REAL_KEY\n' > Config/Debug.xcconfig
          printf 'TMDB_API_KEY = CI_NOT_A_REAL_KEY\n' > Config/Release.xcconfig

      - name: Check secrets
        run: Scripts/check-secrets.sh

      - name: Format and lint
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Test
        run: |
          xcodebuild test \
            -project PickOne.xcodeproj \
            -scheme PickOne \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/PickOneTests" \
            CODE_SIGNING_ALLOWED=NO

      - name: Analyze
        run: |
          xcodebuild analyze \
            -project PickOne.xcodeproj \
            -scheme PickOne \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/PickOneAnalyze" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build release
        run: |
          xcodebuild build \
            -project PickOne.xcodeproj \
            -scheme PickOne \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/PickOneRelease" \
            CODE_SIGNING_ALLOWED=NO

      - name: Inspect app bundle
        run: Scripts/inspect-app-bundle.sh "$RUNNER_TEMP/PickOneRelease/Build/Products/Release-iphoneos/PickOne.app"
